        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/catalyst-profile"
          SELECTED=""
          for directory in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            [ -d "$directory" ] || continue
            for candidate in "$directory"/*.provisionprofile "$directory"/*.mobileprovision; do
              [ -f "$candidate" ] || continue
              plist="$RUNNER_TEMP/catalyst-profile/profile.plist"
              security cms -D -i "$candidate" > "$plist" 2>/dev/null || continue
              app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist" 2>/dev/null || true)"
              team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$plist" 2>/dev/null || true)"
              get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$plist" 2>/dev/null || true)"
              devices="$(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$plist" 2>/dev/null || true)"
              if [ "$app_id" = "$APPLE_TEAM_ID.com.schoologytauri.app" ] && [ "$team" = "$APPLE_TEAM_ID" ] && [ "$get_task_allow" = "false" ] && [ -z "$devices" ]; then
                SELECTED="$candidate"; break 2
              fi
            done
          done
          test -n "$SELECTED" || { echo "::error::No Mac App Store Connect profile for com.schoologytauri.app. Add the macOS platform in App Store Connect and create a Mac App Store Connect profile for the exact App ID." >&2; exit 1; }
          cp "$SELECTED" "$RUNNER_TEMP/ClassWire-Catalyst-AppStore.provisionprofile"
          security cms -D -i "$RUNNER_TEMP/ClassWire-Catalyst-AppStore.provisionprofile" > "$RUNNER_TEMP/ClassWire-Catalyst-AppStore-profile.plist"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/ClassWire-Catalyst-AppStore-profile.plist")"
          echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "Validated Mac App Store profile: $PROFILE_NAME"
      - name: Archive experimental Mac Catalyst app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.catalyst_profile.outputs.name }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          xcodebuild -project Schoology.xcodeproj -scheme Schoology-Catalyst -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -archivePath "$RUNNER_TEMP/ClassWire-Catalyst.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="3rd Party Mac Developer Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" archive
      - name: Export and validate Mac Catalyst package
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.catalyst_profile.outputs.name }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/Catalyst-ExportOptions.plist" "$APPLE_TEAM_ID" "$PROFILE_NAME" <<'PY'
          import plistlib, sys
          path, team, profile = sys.argv[1:]
          options = {"method":"app-store-connect","destination":"export","signingStyle":"manual","teamID":team,"signingCertificate":"3rd Party Mac Developer Application","installerSigningCertificate":"3rd Party Mac Developer Installer","provisioningProfiles":{"com.schoologytauri.app":profile},"stripSwiftSymbols":True}
          with open(path, "wb") as stream: plistlib.dump(options, stream)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ClassWire-Catalyst.xcarchive" \
            -exportPath "$RUNNER_TEMP/Catalyst-export" -exportOptionsPlist "$RUNNER_TEMP/Catalyst-ExportOptions.plist"
          PKG="$(find "$RUNNER_TEMP/Catalyst-export" -maxdepth 2 -type f -name '*.pkg' -print -quit)"
          test -n "$PKG" && test -s "$PKG" || { find "$RUNNER_TEMP/Catalyst-export" -maxdepth 4 -print; exit 1; }
          pkgutil --check-signature "$PKG"
          echo "Validated Mac Catalyst App Store package: $PKG"
      - name: Upload Mac Catalyst build to App Store Connect
        shell: bash
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID || vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || vars.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          PKG="$(find "$RUNNER_TEMP/Catalyst-export" -maxdepth 2 -type f -name '*.pkg' -print -quit)"
          test -n "$PKG" && test -s "$PKG"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          xcrun altool --upload-app --type macos --file "$PKG" --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID" --verbose
          echo "Mac Catalyst upload accepted by App Store Connect; Apple must process it before it appears in TestFlight."
      - name: Upload Mac Catalyst package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassWire-Mac-Catalyst-TestFlight
          path: ${{ runner.temp }}/Catalyst-export/*.pkg
          if-no-files-found: error
          retention-days: 14

  build-catalyst-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.catalyst_preview_only == true }}
    name: Build unsigned Mac Catalyst preview from the iPad app
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
      - name: Prepare ClassWire app icons
        run: swift Scripts/prepare-app-icons.swift
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build the dedicated Mac Catalyst target
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/ClassWire-Catalyst-DerivedData"
          xcodebuild -project Schoology.xcodeproj -scheme Schoology-Catalyst -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$DERIVED_DATA" CODE_SIGNING_ALLOWED=NO build
          APP="$(find "$DERIVED_DATA/Build/Products" -maxdepth 4 -type d -name 'ClassWire.app' -print -quit)"
          test -n "$APP" && test -d "$APP" || {
            echo "The dedicated Catalyst target built without the expected ClassWire.app bundle." >&2
            find "$DERIVED_DATA/Build/Products" -maxdepth 5 -print
            exit 1
          }
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/ClassWire-Mac-Catalyst-Preview.zip"
      - name: Upload unsigned Catalyst preview
        uses: actions/upload-artifact@v4
        with:
          name: ClassWire-Mac-Catalyst-Preview
          path: ${{ runner.temp }}/ClassWire-Mac-Catalyst-Preview.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned ClassWire release
    if: >-
      ${{ always() && inputs.catalyst_preview_only != true && github.ref == 'refs/heads/main' && (needs['build-macos'].result == 'success' || needs['build-ios'].result == 'success') }}
    needs: [build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare version-specific release notes
        id: release_meta
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 - "$VERSION" RELEASE_NOTES.md release-notes.md <<'PY'
          import re, sys
          from pathlib import Path
          version, source, destination = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8")
          sections = re.split(r"(?m)(?=^## \[)", text)
          selected = [section.strip() for section in sections if (match := re.match(r"## \[([^\]]+)\]", section)) and match.group(1) == version]
          if not selected: raise SystemExit(f"No release notes found for {version}")
          Path(destination).write_text("\n\n".join(selected) + "\n", encoding="utf-8")
          PY
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: ClassWire-*
          path: release-assets
          merge-multiple: true
      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          HAS_MACOS=false
          HAS_IOS=false

          if [ -s "release-assets/ClassWire-$VERSION-macOS.dmg" ]; then
            HAS_MACOS=true
          fi

          if [ -s "release-assets/ClassWire-$VERSION-iOS-AdHoc.ipa" ] \
            && [ -s "release-assets/ClassWire-$VERSION-iOS-AdHoc.plist" ] \
            && [ -s "release-assets/ClassWire-$VERSION-iOS-Install-QR.png" ]; then
            HAS_IOS=true
          fi

          if [ "$HAS_MACOS" = "true" ]; then
            test -s "release-assets/Schoology-$VERSION-macOS.dmg" || { echo "Missing the legacy macOS update alias." >&2; exit 1; }
          fi
          if [ "$HAS_IOS" = "true" ]; then
            test -s "release-assets/Schoology-$VERSION-iOS-AdHoc.plist" || { echo "Missing the legacy iOS update alias." >&2; exit 1; }
          fi

          if [ "$HAS_MACOS" != "true" ] && [ "$HAS_IOS" != "true" ]; then
            echo "No complete macOS or iOS release package was produced." >&2
            find release-assets -maxdepth 2 -type f -print || true
            exit 1
          fi

          echo "Publishing successful platform artifacts (macOS=$HAS_MACOS, iOS=$HAS_IOS)."
          find release-assets -maxdepth 2 -type f -print | sort
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.version }}
          name: ${{ steps.release_meta.outputs.version }}
          target_commitish: main
          body_path: release-notes.md
          files: release-assets/*
          overwrite_files: true
          fail_on_unmatched_files: false
          generate_release_notes: false
