name: Build and release Schoology SwiftUI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ios_adhoc_only:
        description: Build and publish only the iOS Ad Hoc package
        required: false
        type: boolean
        default: false
      ios_adhoc_profile_uuid:
        description: Optional exact App Store Connect Ad Hoc profile UUID to use
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: schoology-swiftui-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    if: ${{ inputs.ios_adhoc_only != true }}
    name: Build, sign and notarize macOS
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2 and verify Apple SDKs
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          MACOS_SDK="$(xcrun --sdk macosx --show-sdk-version)"
          [[ "$IOS_SDK" == "27.2" ]] || { echo "Expected iOS SDK 27.2, found $IOS_SDK" >&2; exit 1; }
          [[ "$MACOS_SDK" == "27.2" ]] || { echo "Expected macOS SDK 27.2, found $MACOS_SDK" >&2; exit 1; }
      - name: Prepare Schoology app icons
        run: swift Scripts/prepare-app-icons.swift
      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-port\.[0-9]+$ ]] || { echo "Invalid VERSION: $VERSION" >&2; exit 1; }
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "marketing=${VERSION%-port.*}" >> "$GITHUB_OUTPUT"
          echo "build=${VERSION##*-port.}" >> "$GITHUB_OUTPUT"
      - name: Verify Developer ID signing configuration
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then echo "Required signing value $name is missing." >&2; exit 1; fi
          done
      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive macOS app
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          xcodebuild -project Schoology.xcodeproj -scheme Schoology-macOS -configuration Release \
            -destination 'generic/platform=macOS' -archivePath "$RUNNER_TEMP/Schoology-macOS.xcarchive" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" archive
      - name: Export Developer ID app
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/macOS-ExportOptions.plist" "$APPLE_TEAM_ID" "$SIGNING_IDENTITY" <<'PY'
          import plistlib, sys
          path, team, identity = sys.argv[1:]
          with open(path, "wb") as stream:
              plistlib.dump({"method":"developer-id","destination":"export","signingStyle":"manual","teamID":team,"signingCertificate":identity,"stripSwiftSymbols":True}, stream)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Schoology-macOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/macOS-export" -exportOptionsPlist "$RUNNER_TEMP/macOS-ExportOptions.plist"
          APP="$RUNNER_TEMP/macOS-export/Schoology.app"
          test -d "$APP" || { find "$RUNNER_TEMP/macOS-export" -maxdepth 3 -print; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Notarize app and package macOS assets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/macOS-export/Schoology.app"
          mkdir -p release-macos/dmg-root
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/Schoology-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/Schoology-notarization.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          cp -R "$APP" release-macos/dmg-root/
          ln -s /Applications release-macos/dmg-root/Applications
          hdiutil create -volname Schoology -srcfolder release-macos/dmg-root -ov -format UDZO "release-macos/Schoology-$VERSION-macOS.dmg"
          xcrun notarytool submit "release-macos/Schoology-$VERSION-macOS.dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "release-macos/Schoology-$VERSION-macOS.dmg"
          xcrun stapler validate "release-macos/Schoology-$VERSION-macOS.dmg"
      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-macOS
          path: release-macos/Schoology-*-macOS.*
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build signed iOS Ad Hoc IPA
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.2 and verify Apple SDKs
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          MACOS_SDK="$(xcrun --sdk macosx --show-sdk-version)"
          [[ "$IOS_SDK" == "27.2" ]] || { echo "Expected iOS SDK 27.2, found $IOS_SDK" >&2; exit 1; }
          [[ "$MACOS_SDK" == "27.2" ]] || { echo "Expected macOS SDK 27.2, found $MACOS_SDK" >&2; exit 1; }
      - name: Prepare Schoology app icons
        run: swift Scripts/prepare-app-icons.swift
      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-port\.[0-9]+$ ]] || { echo "Invalid VERSION: $VERSION" >&2; exit 1; }
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "marketing=${VERSION%-port.*}" >> "$GITHUB_OUTPUT"
          echo "build=${VERSION##*-port.}" >> "$GITHUB_OUTPUT"
      - name: Verify iOS Ad Hoc signing configuration
        shell: bash
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID || vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || vars.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD APPSTORE_API_PRIVATE_KEY APPSTORE_API_KEY_ID APPSTORE_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then echo "Required signing value $name is missing." >&2; exit 1; fi
          done
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Download Apple Ad Hoc provisioning profiles
        uses: Apple-Actions/download-provisioning-profiles@v7.0.0
        with:
          bundle-id: com.schoologytauri.app
          profile-type: IOS_APP_ADHOC
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID || vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID || vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - name: Import Apple distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      - name: Select and validate Ad Hoc profile
        id: profile
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
          REQUESTED_PROFILE_UUID: ${{ inputs.ios_adhoc_profile_uuid }}
        run: |
          set -euo pipefail
          REQUESTED_UUID="${REQUESTED_PROFILE_UUID:-}"
          if [ -n "$REQUESTED_UUID" ] && [[ ! "$REQUESTED_UUID" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
            echo "The requested provisioning profile UUID is malformed." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/profile-checks"
          SELECTED=""
          for directory in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            [ -d "$directory" ] || continue
            for candidate in "$directory"/*.mobileprovision; do
              [ -f "$candidate" ] || continue
              plist="$RUNNER_TEMP/profile-checks/profile.plist"
              security cms -D -i "$candidate" > "$plist" 2>/dev/null || continue
              app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist" 2>/dev/null || true)"
              devices="$(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$plist" 2>/dev/null || true)"
              team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$plist" 2>/dev/null || true)"
              uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist" 2>/dev/null || true)"
              if [[ "$app_id" == "$APPLE_TEAM_ID.com.schoologytauri.app" && -n "$devices" && "$team" == "$APPLE_TEAM_ID" && ( -z "$REQUESTED_UUID" || "$uuid" == "$REQUESTED_UUID" ) ]]; then SELECTED="$candidate"; break 2; fi
            done
          done
          test -n "$SELECTED" || { echo "No matching Ad Hoc profile for com.schoologytauri.app with registered devices was downloaded (requested UUID: ${REQUESTED_UUID:-any})." >&2; exit 1; }
          cp "$SELECTED" "$RUNNER_TEMP/Schoology-AdHoc.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/Schoology-AdHoc.mobileprovision" > "$RUNNER_TEMP/Schoology-AdHoc-profile.plist"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/Schoology-AdHoc-profile.plist")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/Schoology-AdHoc-profile.plist")"
          echo "name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "Using Ad Hoc profile: $PROFILE_NAME ($PROFILE_UUID)"
      - name: Archive iOS app for registered devices
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          xcodebuild -project Schoology.xcodeproj -scheme Schoology-iOS -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Schoology-iOS.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" archive
      - name: Export Ad Hoc IPA and create install assets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/iOS-ExportOptions.plist" "$APPLE_TEAM_ID" "$PROFILE_NAME" <<'PY'
          import plistlib, sys
          path, team, profile = sys.argv[1:]
          options = {"method":"release-testing","destination":"export","signingStyle":"manual","teamID":team,"signingCertificate":"Apple Distribution","provisioningProfiles":{"com.schoologytauri.app":profile},"stripSwiftSymbols":True}
          with open(path, "wb") as stream: plistlib.dump(options, stream)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Schoology-iOS.xcarchive" -exportPath "$RUNNER_TEMP/iOS-export" -exportOptionsPlist "$RUNNER_TEMP/iOS-ExportOptions.plist"
          IPA="$(find "$RUNNER_TEMP/iOS-export" -maxdepth 2 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA" && test -s "$IPA" || { find "$RUNNER_TEMP/iOS-export" -maxdepth 3 -print; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa-validation"
          ditto -x -k "$IPA" "$RUNNER_TEMP/ipa-validation"
          APP="$(find "$RUNNER_TEMP/ipa-validation/Payload" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          test "$APP_ID" = "com.schoologytauri.app" || { echo "Unexpected bundle identifier: $APP_ID" >&2; exit 1; }
          test -s "$APP/Assets.car" || { echo "The exported iOS app is missing Assets.car. The asset catalog must be compiled into the application target; inspect the Xcode CompileAssetCatalog build phase." >&2; find "$APP" -maxdepth 3 -print; exit 1; }
          ICON_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist" 2>/dev/null || true)"
          test "$ICON_NAME" = "AppIcon" || { echo "The exported iOS app does not contain the compiled AppIcon primary-icon metadata (CFBundleIconName=$ICON_NAME)." >&2; plutil -p "$APP/Info.plist" | grep -A12 -B2 'CFBundleIcons' || true; exit 1; }
          xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" > "$RUNNER_TEMP/asset-catalog.json"
          python3 - "$RUNNER_TEMP/asset-catalog.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              assets = json.load(stream)
          icons = [
              item for item in assets
              if item.get("Name") == "AppIcon" and item.get("AssetType") == "Icon Image"
          ]
          if not icons:
              raise SystemExit("The exported Assets.car contains no AppIcon image renditions.")
          if not any(item.get("PixelWidth") == 1024 and item.get("PixelHeight") == 1024 for item in icons):
              raise SystemExit("The exported Assets.car is missing the 1024x1024 AppIcon rendition.")
          print(f"Verified {len(icons)} compiled AppIcon renditions, including the 1024x1024 icon.")
          PY
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/embedded-profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/embedded-profile.plist" >/dev/null
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p ios-install-assets
          IPA_NAME="Schoology-$VERSION-iOS-AdHoc.ipa"
          MANIFEST_NAME="Schoology-$VERSION-iOS-AdHoc.plist"
          QR_NAME="Schoology-$VERSION-iOS-Install-QR.png"
          cp "$IPA" "ios-install-assets/$IPA_NAME"
          IPA_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$IPA_NAME"
          BUILD_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          cat > "ios-install-assets/$MANIFEST_NAME" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>items</key><array><dict>
          <key>assets</key><array><dict><key>kind</key><string>software-package</string><key>url</key><string>$IPA_URL</string></dict></array>
          <key>metadata</key><dict><key>bundle-identifier</key><string>com.schoologytauri.app</string><key>bundle-version</key><string>$BUILD_VERSION</string><key>kind</key><string>software</string><key>title</key><string>Schoology</string></dict>
          </dict></array></dict></plist>
          PLIST
          MANIFEST_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$MANIFEST_NAME"
          ENCODED_MANIFEST_URL="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$MANIFEST_URL")"
          npx --yes qrcode --output "ios-install-assets/$QR_NAME" "itms-services://?action=download-manifest&url=$ENCODED_MANIFEST_URL"
          cat > ios-install-assets/README.txt <<EOF
          Schoology iOS Ad Hoc installation
          Register this iPhone or iPad UDID and include it in the Ad Hoc provisioning profile before installing.
          Scan the QR code with the device camera and follow the iOS installation prompt.
          If iOS asks, enable Developer Mode in Settings > Privacy & Security > Developer Mode.
          This package is not distributed through TestFlight or the App Store.
          EOF
      - name: Upload iOS Ad Hoc release assets
        uses: actions/upload-artifact@v4
        with:
          name: Schoology-iOS-AdHoc
          path: ios-install-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned Schoology release
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' && (needs['build-macos'].result == 'success' || needs['build-ios'].result == 'success') }}
    needs: [build-macos, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare version-specific release notes
        id: release_meta
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 - "$VERSION" RELEASE_NOTES.md release-notes.md <<'PY'
          import re, sys
          from pathlib import Path
          version, source, destination = sys.argv[1:]
          text = Path(source).read_text(encoding="utf-8")
          sections = re.split(r"(?m)(?=^## \[)", text)
          selected = [section.strip() for section in sections if (match := re.match(r"## \[([^\]]+)\]", section)) and match.group(1) == version]
          if not selected: raise SystemExit(f"No release notes found for {version}")
          Path(destination).write_text("\n\n".join(selected) + "\n", encoding="utf-8")
          PY
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: Schoology-*
          path: release-assets
          merge-multiple: true
      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          HAS_MACOS=false
          HAS_IOS=false

          if [ -s "release-assets/Schoology-$VERSION-macOS.dmg" ]; then
            HAS_MACOS=true
          fi

          if [ -s "release-assets/Schoology-$VERSION-iOS-AdHoc.ipa" ] \
            && [ -s "release-assets/Schoology-$VERSION-iOS-AdHoc.plist" ] \
            && [ -s "release-assets/Schoology-$VERSION-iOS-Install-QR.png" ]; then
            HAS_IOS=true
          fi

          if [ "$HAS_MACOS" != "true" ] && [ "$HAS_IOS" != "true" ]; then
            echo "No complete macOS or iOS release package was produced." >&2
            find release-assets -maxdepth 2 -type f -print || true
            exit 1
          fi

          echo "Publishing successful platform artifacts (macOS=$HAS_MACOS, iOS=$HAS_IOS)."
          find release-assets -maxdepth 2 -type f -print | sort
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.version }}
          name: ${{ steps.release_meta.outputs.version }}
          target_commitish: main
          body_path: release-notes.md
          files: release-assets/*
          overwrite_files: true
          fail_on_unmatched_files: false
          generate_release_notes: false
