name: Schoology
options:
  bundleIdPrefix: com.schoologytauri
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2026.10.132"
    CURRENT_PROJECT_VERSION: "132"
    PRODUCT_NAME: ClassWire
    INFOPLIST_KEY_CFBundleDisplayName: ClassWire
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
targets:
  Schoology-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/DemoMedia
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schoologytauri.app
        CODE_SIGN_ENTITLEMENTS: Config/Schoology.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: ClassWire can connect to an Ollama AI server on your local network.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a ClassWire QR code to sign in.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Attach files and images to ClassWire assignments.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        UIBackgroundModes:
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - com.schoologytauri.app.notifications-refresh
        SUPPORTS_MACCATALYST: NO
    info:
      path: Config/Generated-iOS-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~iphone":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.schoologytauri.app
            CFBundleURLSchemes:
              - schoology
              - com.googleusercontent.apps.813096753007-n919j0u9c99rcll1f6cb4knme0oapdru
  Schoology-Catalyst:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/DemoMedia
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schoologytauri.app
        CODE_SIGN_ENTITLEMENTS: Config/Schoology.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: ClassWire can connect to an Ollama AI server on your local network.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a ClassWire QR code to sign in.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Attach files and images to ClassWire assignments.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
    info:
      path: Config/Generated-Catalyst-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~iphone":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.schoologytauri.app
            CFBundleURLSchemes:
              - schoology
              - com.googleusercontent.apps.813096753007-n919j0u9c99rcll1f6cb4knme0oapdru
  Schoology-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/DemoMedia
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schoologytauri.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
        CODE_SIGN_ENTITLEMENTS: Config/Schoology-macOS.entitlements
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a ClassWire QR code to sign in.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Config/Generated-macOS-Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.schoologytauri.app
            CFBundleURLSchemes:
              - schoology
              - com.googleusercontent.apps.813096753007-n919j0u9c99rcll1f6cb4knme0oapdru
